# Optional GitHub Actions mirror; native per-OS builds are primary.
name: Secure Pocket Link binaries

on:
  workflow_dispatch:
  push:
    tags: ["link-v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            file: SecurePocketLink.exe
          - os: ubuntu-latest
            name: linux-x64
            file: SecurePocketLink
          - os: macos-15-intel
            name: macos-intel
            file: SecurePocketLink
          - os: macos-15
            name: macos-apple-silicon
            file: SecurePocketLink
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r link-server/requirements-build.txt
      - run: python link-server/package.py
      - run: python link-server/make-release-zip.py --name "${{ matrix.name }}" --executable "${{ matrix.file }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secure-pocket-link-${{ matrix.name }}
          path: dist/SecurePocketLink-${{ matrix.name }}.zip
