# Optional override: replace Compose's generated Docling leaf certificate with
# a certificate issued by your own CA. TLS is already enabled in compose.yaml.
services:
  link:
    environment:
      SSL_CERT_FILE: /run/secrets/docling-ca.pem
      LINK_DEFAULT_DOCLING_URL: https://docling:5001
    volumes:
      - type: bind
        source: ${DOCLING_TLS_CA_FILE:?Set DOCLING_TLS_CA_FILE to the CA certificate file}
        target: /run/secrets/docling-ca.pem
        read_only: true
        bind:
          create_host_path: false
  docling:
    environment:
      DOCLING_HEALTH_URL: https://docling:5001/health
      DOCLING_HEALTH_CA: /run/secrets/docling-ca.pem
    volumes:
      - docling-models:/models
      - type: bind
        source: ${DOCLING_TLS_CA_FILE:?Set DOCLING_TLS_CA_FILE to the CA certificate file}
        target: /run/secrets/docling-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCLING_TLS_CERT_FILE:?Set DOCLING_TLS_CERT_FILE to the Docling certificate file}
        target: /run/secrets/docling/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCLING_TLS_KEY_FILE:?Set DOCLING_TLS_KEY_FILE to the Docling private key file}
        target: /run/secrets/docling/tls.key
        read_only: true
        bind:
          create_host_path: false
