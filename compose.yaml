services:
  link:
    build:
      context: ./link-server
    ports:
      # A trusted host TLS proxy or tailnet forwarder may connect here. The API
      # is not directly reachable from the LAN by default.
      - "127.0.0.1:${LINK_PUBLIC_API_PORT:-8732}:8732"
      # Desktop settings UI is reachable only from this computer.
      - "127.0.0.1:${LINK_PUBLIC_ADMIN_PORT:-8733}:8733"
    environment:
      LINK_PUBLIC_API_PORT: "${LINK_PUBLIC_API_PORT:-8732}"
      LINK_PUBLIC_ADMIN_PORT: "${LINK_PUBLIC_ADMIN_PORT:-8733}"
      LINK_PUBLIC_URL: "${LINK_PUBLIC_URL:-}"
      LINK_DEFAULT_LIBRARY_ROOT: /data
      LINK_DEFAULT_DOCLING_URL: https://docling:5001
      LINK_DEFAULT_DOCLING_ENABLED: "true"
      SSL_CERT_FILE: /run/secrets/docling-ca/ca.crt
      LINK_DOCLING_API_KEY_FILE: /run/secrets/docling-api/api.key
      LINK_ADMIN_TOKEN_FILE: /run/link-admin/admin.token
    volumes:
      - link-library:/data
      - link-config:/config
      - link-key:/keys
      - type: volume
        source: docling-ca-public
        target: /run/secrets/docling-ca
        read_only: true
      - type: volume
        source: docling-api-key
        target: /run/secrets/docling-api
        read_only: true
    depends_on:
      docling-tls-init:
        condition: service_healthy
      docling:
        # Keep backup API startup independent of first-run model downloads.
        condition: service_started
    restart: unless-stopped
    command: ["python", "secure_pocket_link.py", "--proxy-backend", "--port", "8732", "--admin-host", "0.0.0.0", "--admin-port", "8733", "--config", "/config/config.json", "--key-file", "/keys/link.key"]
    read_only: true
    tmpfs:
      - /tmp:size=${LINK_TMP_SIZE:-512m},mode=1777
      - /run/link-admin:size=1m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: "${LINK_MEMORY_LIMIT:-1g}"
    cpus: "${LINK_CPU_LIMIT:-1.0}"
    networks:
      - processing

  docling:
    # Thin adapter image: pinned official Docling Serve base plus upstream ASR extra.
    image: secure-pocket-docling-serve:1.38.2-audio
    build:
      context: ./link-server
      dockerfile: Dockerfile.docling
    environment:
      DOCLING_DEVICE: cpu
      DOCLING_SERVE_ENABLE_UI: "false"
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: "5001"
      HOME: /models
      HF_HOME: /models/huggingface
      DOCLING_SERVE_ARTIFACTS_PATH: /models/docling
      DOCLING_HEALTH_URL: https://docling:5001/health
      DOCLING_HEALTH_CA: /run/secrets/docling-ca/ca.crt
    volumes:
      - docling-models:/models
      - type: volume
        source: docling-ca-public
        target: /run/secrets/docling-ca
        read_only: true
      - type: volume
        source: docling-server-tls
        target: /run/secrets/docling
        read_only: true
      - type: volume
        source: docling-api-key
        target: /run/secrets/docling-api
        read_only: true
    depends_on:
      docling-tls-init:
        condition: service_healthy
    command: ["/opt/app-root/bin/python", "/opt/app-root/bin/start_docling_secure.py"]
    read_only: true
    tmpfs:
      - /tmp:size=${DOCLING_TMP_SIZE:-2g},mode=1777
      - /var/tmp:size=64m,mode=1777
    expose:
      - "5001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, ssl, urllib.request; from pathlib import Path; key=Path('/run/secrets/docling-api/api.key').read_text().strip(); req=urllib.request.Request(os.environ['DOCLING_HEALTH_URL'], headers={'X-Api-Key':key}); urllib.request.urlopen(req, timeout=5, context=ssl.create_default_context(cafile=os.environ.get('DOCLING_HEALTH_CA'))).read(1024)"
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 45s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: "${DOCLING_MEMORY_LIMIT:-6g}"
    cpus: "${DOCLING_CPU_LIMIT:-2.0}"
    shm_size: "${DOCLING_SHM_SIZE:-256m}"
    networks:
      - processing

  docling-tls-init:
    build:
      context: ./link-server
    user: "1001:0"
    command: ["python", "generate_docling_tls.py"]
    volumes:
      - docling-tls-state:/tls-state
      - docling-ca-public:/docling-ca
      - docling-server-tls:/docling-server
      - docling-api-key:/docling-auth
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    mem_limit: 128m
    network_mode: none
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from pathlib import Path; import sys; sys.exit(0 if all(Path(p).is_file() for p in ['/tls-state/ca.key','/docling-ca/ca.crt','/docling-server/tls.crt','/docling-server/tls.key','/docling-auth/api.key']) else 1)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

volumes:
  link-library:
  link-config:
  link-key:
  docling-models:
  docling-tls-state:
  docling-ca-public:
  docling-server-tls:
  docling-api-key:

networks:
  processing:
    driver: bridge
