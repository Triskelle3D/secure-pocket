<!-- Clean Tactile Capsule Switch -->

<span class="w-5 h-5 rounded-full bg-surface shadow-sm translate-x-5 transition-transform duration-200" id="hardware-toggle-thumb"></span>
</button>

<script>
  (function() {
    // Waveform simulation
    const bars = document.querySelectorAll('.bar');
    if (bars.length) {
      setInterval(() => {
        bars.forEach((bar) => {
          const rand = Math.floor(Math.random() * 48) + 6;
          bar.style.height = `${rand}px`;
        });
      }, 180);
    }

    // Toggle switch interaction
    const toggle = document.getElementById('hardware-toggle-btn');
    const thumb = document.getElementById('hardware-toggle-thumb');
    let isEnabled = true;

    if (toggle && thumb) {
      toggle.addEventListener('click', () => {
        isEnabled = !isEnabled;
        toggle.setAttribute('aria-checked', isEnabled.toString());
        if (isEnabled) {
          toggle.classList.remove('bg-surface-variant');
          toggle.classList.add('bg-secondary');
          thumb.classList.add('translate-x-5');
          thumb.classList.remove('translate-x-0');
        } else {
          toggle.classList.remove('bg-secondary');
          toggle.classList.add('bg-surface-variant');
          thumb.classList.remove('translate-x-5');
          thumb.classList.add('translate-x-0');
        }
      });
    }

    // Stop recording feedback microinteraction
    const stopBtn = document.getElementById('stop-record-btn');
    if (stopBtn) {
      stopBtn.addEventListener('click', () => {
        stopBtn.classList.add('opacity-70');
        stopBtn.innerHTML = `
          <span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>
          <span class="font-medium tracking-tight">Finishing...</span>
        `;
      });
    }

    // Tag switching microinteraction
    const tagPills = document.querySelectorAll('.tag-pill');
    tagPills.forEach(pill => {
      pill.addEventListener('click', () => {
        tagPills.forEach(p => {
          p.classList.remove('bg-surface-container-high', 'text-primary');
          p.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
        });
        pill.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
        pill.classList.add('bg-surface-container-high', 'text-primary');
      });
    });
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe pointer-events-none" data-active-classes="text-primary opacity-100"><div class="px-gutter pb-space-md pt-space-xs pointer-events-auto"><div class="h-16 rounded-full bg-surface-container-low/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.25)] flex items-center justify-around px-space-md"><a class="min-w-[44px] min-h-[44px] flex flex-col items-center justify-center gap-0.5 text-on-surface-variant opacity-60 hover:opacity-100 transition-opacity" data-path="device-status" href="#"><span class="material-symbols-outlined text-[22px]">radio</span><span class="font-label-caps text-label-caps uppercase">Device</span></a><a aria-current="page" class="min-w-[44px] min-h-[44px] flex flex-col items-center justify-center gap-0.5 transition-opacity text-primary opacity-100" data-path="record-studio" href="#"><span class="material-symbols-outlined text-[22px]">fiber_manual_record</span><span class="font-label-caps text-label-caps uppercase">Record</span></a><a class="min-w-[44px] min-h-[44px] flex flex-col items-center justify-center gap-0.5 text-on-surface-variant opacity-60 hover:opacity-100 transition-opacity" data-path="audio-library" href="#"><span class="material-symbols-outlined text-[22px]">graphic_eq</span><span class="font-label-caps text-label-caps uppercase">Library</span></a><a class="min-w-[44px] min-h-[44px] flex flex-col items-center justify-center gap-0.5 text-on-surface-variant opacity-60 hover:opacity-100 transition-opacity" data-path="system-settings" href="#"><span class="material-symbols-outlined text-[22px]">tune</span><span class="font-label-caps text-label-caps uppercase">Settings</span></a></div></div></nav></body></html>
